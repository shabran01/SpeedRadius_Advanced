<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Status Page</title>
</head>
<body>
  <h2>My Monitor Status</h2>
  <div id="status"></div>

  <script>
    async function loadStatus() {
      const apiKey = "YOUR_API_KEY_HERE"; // replace with your Read-Only API key
      const url = `https://api.uptimerobot.com/v2/getMonitors`;

      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ api_key: apiKey, format: "json" })
      });

      const data = await response.json();
      console.log(data);

      document.getElementById("status").innerText =
        JSON.stringify(data.monitors, null, 2);
    }

    loadStatus();
  </script>
</body>
</html>
