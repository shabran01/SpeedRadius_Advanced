<div style="width:100%; font-family:'Segoe UI',Arial,sans-serif;">
  <svg width="100%" height="34" viewBox="0 0 320 34" preserveAspectRatio="none" style="display:block;">
    <rect x="0" y="0" width="320" height="34" rx="7" ry="7" fill="#1a56db"></rect>
    <text x="12" y="21" fill="#ffffff" style="font-size:11px; font-weight:700; letter-spacing:0.6px; text-transform:uppercase;">[[company_name]]</text>
    <text x="306" y="21" text-anchor="end" fill="#dbeafe" style="font-size:10px; font-weight:700;">#[[counter]]</text>
  </svg>
  <div style="padding:12px 12px 9px; background-color:#ffffff; border:1.5px solid #dbe4f0; border-top:none; border-radius:0 0 7px 7px;">
    <div style="text-align:center; margin-bottom:9px;">
      <div style="font-size:11px; color:#475569; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; font-weight:700;">Access Code</div>
      <div style="font-size:28px; font-weight:800; color:#0f172a; letter-spacing:4px; font-family:'Courier New',monospace; background-color:#f8fbff; border:2px dashed #8ba4c7; border-radius:5px; padding:6px 10px; display:inline-block;">[[voucher_code]]</div>
    </div>
    <div style="text-align:center; border-top:1px solid #e2e8f0; padding-top:8px; margin-top:2px;">
      <span style="font-size:12px; color:#334155; font-weight:600;">[[plan]]</span>
      <span style="font-size:11px; color:#1d4ed8; font-weight:700; border:1.5px solid #1d4ed8; border-radius:12px; padding:2px 10px; display:inline-block; margin-left:7px;">[[price]]</span>
    </div>
  </div>
</div>
